name: Deploy Worker

# Deploys the API Worker (workers/sogotable-api.js) to Cloudflare whenever main
# changes and the Worker tests pass. The frontend is deployed separately by
# Cloudflare Pages' own Git integration.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN, a Cloudflare API token made
# from the "Edit Cloudflare Workers" template (account_id comes from
# wrangler.toml). Until that secret exists the deploy step is skipped with a
# warning and the run stays green.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Worker tests
        run: npm run test:worker

      - name: Deploy Worker
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler.toml

      - name: Explain skipped deploy
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, so the Worker deploy was skipped. See .github/workflows/deploy.yml."
